[package]
name = "groundstation"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "groundstation"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "corehost"
required-features = ["native-host"]

[[example]]
name = "synthetic_shot"
required-features = ["synthetic"]

[features]
native-host = []
jni-host = ["native-host", "dep:jni"]
synthetic = ["dep:wgpu", "dep:glam", "dep:pollster", "dep:earcut", "dep:http-cache-semantics", "dep:http", "dep:bytemuck", "dep:range-alloc"]

[dependencies]
mavlink = { version = "0.18", default-features = false, features = ["dialect-ardupilotmega", "std", "mav2-message-signing", "mav2-message-extensions"] }
html-escape = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
shapefile = "0.9.0"
utm = "0.1.6"
sha2 = "0.11.0"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex = "1.13.1"
num-traits = "0.2"
log = "0.4.34"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.23.1"
url = "2"
geoconvert = "1.0.2"
geographiclib-rs = "0.2.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
little_exif = "0.6.23"
px4-ulog = "0.6.1"
jni = { version = "0.21.1", optional = true }
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
getrandom = "0.4.3"
crc = "3.4.0"
jpeg-encoder = "0.7.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm"] }
quick_cache = { version = "0.7.0", default-features = false }
sha1 = "0.11"
fatfs = "0.3"
fscommon = "0.1"
mbrman = "0.5"
rayon-core = "1.13.0"
once_cell = "1.21.4"
mvt-reader = { version = "2.5.0", default-features = false }
geo-types = "0.7.20"
wgpu = { version = "30.0.1", optional = true }
glam = { version = "0.34.1", optional = true }
pollster = { version = "1.0.1", optional = true }
earcut = { version = "0.4.11", optional = true }
http-cache-semantics = { version = "3.0.0", optional = true }
http = { version = "1.5.0", optional = true }
bytemuck = { version = "1.25.2", optional = true }
range-alloc = { version = "0.1.5", optional = true }
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
webpki-roots = "1.0.9"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
fs4 = { version = "0.13", features = ["sync"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
rustls-webpki = "0.103"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
wasm-bindgen = "0.2.128"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = ["XmlHttpRequest", "XmlHttpRequestResponseType", "console", "OffscreenCanvas", "WorkerGlobalScope", "DedicatedWorkerGlobalScope", "RequestInit", "Response", "Headers", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader"] }
wasm-bindgen-futures = "0.4.78"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
sqlite-wasm-rs = { version = "0.5.5", default-features = false }
wgpu = { version = "30.0.1", optional = true, features = ["webgl"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
serial2 = { version = "0.2.38", features = ["windows"] }

[target.'cfg(not(any(target_os = "ios", target_family = "wasm")))'.dependencies]
serialport = "4.10.1"

[dev-dependencies]
serde_norway = "0.9"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_System_Pipes"] }

[build-dependencies]
flate2 = "1.1.10"
