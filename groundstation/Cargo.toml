[package]
name = "groundstation"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "groundstation"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "corehost"
required-features = ["native-host"]

[features]
native-host = []
jni-host = ["native-host", "dep:jni"]

[dependencies]
mavlink = { version = "0.18", default-features = false, features = ["dialect-ardupilotmega", "std", "mav2-message-signing", "mav2-message-extensions"] }
html-escape = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
shapefile = "0.9.0"
utm = "0.1.6"
sha2 = "0.11.0"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex = "1.13.1"
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
num-traits = "0.2"
log = "0.4.34"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
webpki-roots = "1.0.9"
base64 = "0.23.1"
url = "2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
geoconvert = "1.0.2"
geographiclib-rs = "0.2.7"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
little_exif = "0.6.23"
px4-ulog = "0.6.1"
jni = { version = "0.21.1", optional = true }
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
getrandom = "0.4.3"
crc = "3.4.0"
fs4 = { version = "0.13", features = ["sync"] }
jpeg-encoder = "0.7.1"
x509-parser = { version = "0.18.1", features = ["verify"] }
rustls-webpki = "0.103"

[target.'cfg(not(target_os = "android"))'.dependencies]
serialport = "4.10.1"

[build-dependencies]
flate2 = "1.1.10"
