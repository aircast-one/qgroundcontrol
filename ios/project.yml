name: Aircast

options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    QGC_ROOT: $(SRCROOT)/..
    GSTREAMER_IOS: $(HOME)/Library/Developer/GStreamer/iPhone.sdk/GStreamer.framework
    DEVELOPMENT_TEAM: F5H5LXSGJV
    MARKETING_VERSION: "5.6"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Aircast:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
      - path: Sources
        type: syncedFolder
      - path: Video
      - path: Resources
        buildPhase: resources
      - path: Vendor/ca-certificates.crt
        buildPhase: resources
      - path: ../src/Bridge/QGCVideoC.cc
    dependencies:
      - framework: Vendor/MapLibre.xcframework
        embed: true
    preBuildScripts:
      - name: Rust core
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: '"$SRCROOT/build-core.sh"'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.aircast.app
        PRODUCT_NAME: Aircast
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core
        HEADER_SEARCH_PATHS: $(QGC_ROOT)/src/Bridge $(GSTREAMER_IOS)/Headers
        GCC_PREPROCESSOR_DEFINITIONS[sdk=iphoneos*]: $(inherited) QGC_GST_STREAMING=1
        CORE_LIB_DIR_iphoneos: $(QGC_ROOT)/groundstation/target/aarch64-apple-ios/release
        CORE_LIB_DIR_iphonesimulator: $(QGC_ROOT)/groundstation/target/aarch64-apple-ios-sim/release
        CORE_LIB_DIR: $(CORE_LIB_DIR_$(PLATFORM_NAME))
        ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        GSTREAMER_LINK_iphoneos: $(GSTREAMER_IOS)/GStreamer
        GSTREAMER_LINK_iphonesimulator: ""
        OTHER_LDFLAGS: >-
          $(inherited)
          $(CORE_LIB_DIR)/libgroundstation.a
          $(GSTREAMER_LINK_$(PLATFORM_NAME))
          -lc++ -liconv -lresolv -lz
          -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework VideoToolbox
          -framework AudioToolbox -framework CoreAudio -framework OpenGLES -framework QuartzCore
          -framework CoreLocation -framework Security -framework SystemConfiguration -framework UIKit
          -framework AssetsLibrary -framework CoreFoundation -framework Foundation
  AircastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        type: syncedFolder
    dependencies:
      - target: Aircast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.aircast.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Aircast.app/Aircast
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core
        HEADER_SEARCH_PATHS: $(QGC_ROOT)/src/Bridge

schemes:
  Aircast:
    build:
      targets:
        Aircast: all
        AircastTests: [test]
    test:
      targets:
        - AircastTests
