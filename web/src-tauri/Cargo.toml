[package]
name = "aircast-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
groundstation = { path = "../../groundstation", features = ["native-host", "synthetic"] }
tauri = { version = "=2.11.5", features = [] }
serde_json = "1"
retina = "0.4.22"
futures = "0.3"
url = "2"
percent-encoding = "2"
mpeg2ts = "0.6.1"
muxide = "0.5.0"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-window-state = "=2.4.1"
tokio = { version = "1", features = ["net", "io-util"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
