name: Rust Core

on:
  pull_request:
    paths:
      - 'groundstation/**'
      - '.github/workflows/groundstation.yml'
      - '.github/actions/rust-toolchain/**'
  push:
    branches:
      - main
      - master
      - 'Stable*'
    paths:
      - 'groundstation/**'
      - '.github/workflows/groundstation.yml'
      - '.github/actions/rust-toolchain/**'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            groundstation/target
          key: groundstation-${{ runner.os }}-${{ hashFiles('groundstation/rust-toolchain.toml', 'groundstation/Cargo.lock') }}
          restore-keys: groundstation-${{ runner.os }}-

      - name: Test
        working-directory: groundstation
        run: cargo test --locked
