name: Web

on:
  pull_request:
    paths:
      - 'web/**'
      - 'groundstation/**'
      - 'src/**'
      - 'resources/**'
      - 'android/app/src/main/res/**'
      - '.github/workflows/web.yml'
      - '.github/workflows/aircast-release.yml'
      - '.github/actions/rust-toolchain/**'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'groundstation/**'
      - 'src/**'
      - 'resources/**'
      - 'android/app/src/main/res/**'
      - '.github/workflows/web.yml'
      - '.github/workflows/aircast-release.yml'
      - '.github/actions/rust-toolchain/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  MEDIAMTX_VERSION: v1.19.2

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Install llvm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            groundstation/target
          key: web-core-${{ runner.os }}-${{ hashFiles('groundstation/rust-toolchain.toml', 'groundstation/Cargo.lock') }}
          restore-keys: web-core-${{ runner.os }}-

      - name: Build core
        run: web/build-core.sh

      - uses: actions/upload-artifact@v7
        with:
          name: web-core
          path: web/src/core/pkg
          retention-days: 1

  checks:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: web-core
          path: web/src/core/pkg

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

  e2e:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ffmpeg and mediamtx
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin mediamtx

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: web/e2e/wt/go.mod
          cache-dependency-path: web/e2e/wt/go.sum

      - uses: actions/download-artifact@v8
        with:
          name: web-core
          path: web/src/core/pkg

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: npx playwright test --shard="${SHARD}/${SHARDS}" --workers=1 --reporter=list,github

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-e2e-results-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7
