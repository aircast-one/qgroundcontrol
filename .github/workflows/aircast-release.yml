name: Aircast Release
run-name: Aircast Release ${{ inputs.version }}


permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to (re)release (e.g. aircast-v5.0.9, aircast-v5.0.9-dev.1)"
        required: true
        type: string

env:
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      short_version: ${{ steps.config.outputs.short_version }}
      environment: ${{ steps.config.outputs.environment }}
      is_production: ${{ steps.config.outputs.is_production }}
    steps:
      - id: config
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_version=${VERSION#aircast-}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^aircast-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -beta\. ]]; then
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -staging\. ]]; then
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi
          echo "Release: $VERSION"

  build-android:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 != '' }}
      AIRCAST_ABI: arm64-v8a
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/deploy/android/android_release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      QT_ANDROID_ABIS: ${{ needs.setup.outputs.is_production == 'true' && 'arm64-v8a;armeabi-v7a' || 'arm64-v8a' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set Android SDK location
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Build Setup (Android)
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: Release
          cpm-modules: ${{ runner.temp }}/build/cpm_modules

      - name: Install host build dependencies
        uses: ./.github/actions/install-dependencies

      - name: Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          cache: 'true'
          android-abis: ${{ env.QT_ANDROID_ABIS }}
          cargo-ndk: 'true'

      - name: Install release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$QT_ANDROID_KEYSTORE_STORE_PASS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$QT_ANDROID_KEYSTORE_PATH"
            echo "Installed aircast release keystore"
          else
            echo "::warning::No keystore secret - signing the APK with a throwaway debug key"
            keytool -genkey -v \
              -keystore "${RUNNER_TEMP}/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
              echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
              echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
              echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build
        timeout-minutes: 75
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Collect APK
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          APK_DIR="${RUNNER_TEMP}/build/android-build"
          ls "${APK_DIR}"/*.apk
          mkdir -p out
          cp "${APK_DIR}"/*.apk "out/AircastQGC-${SHORT}.apk"

      - name: Build the AAR the native head links
        working-directory: ${{ runner.temp }}/build
        run: cmake --build . --target aar --config Release

      - name: Set up the pinned JDK for the native head
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.setup.outputs.android_java_version }}

      - name: Build the native head
        working-directory: ${{ github.workspace }}/android
        env:
          AIRCAST_QGC_AAR: ${{ runner.temp }}/build/android-build/AircastQGC.aar
          AIRCAST_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && env.QT_ANDROID_KEYSTORE_PATH || '' }}
          AIRCAST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          AIRCAST_KEY_ALIAS: ${{ env.QT_ANDROID_KEYSTORE_ALIAS }}
          AIRCAST_VERSION_CODE: ${{ github.run_number }}
          RELEASE_TAG: ${{ needs.setup.outputs.version }}
        run: |
          export AIRCAST_VERSION_NAME="${RELEASE_TAG#aircast-v}"
          ./gradlew --no-daemon :app:testQtDebugUnitTest :map:testDebugUnitTest
          ./gradlew --no-daemon :app:assembleQtRelease

      - name: Collect the native head APK
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          for f in android/app/build/outputs/apk/qt/release/app-qt-release*.apk; do
            case "$f" in
              *unsigned*) cp "$f" "out/AircastAndroid-${SHORT}-unsigned.apk" ;;
              *)          cp "$f" "out/AircastAndroid-${SHORT}.apk" ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-android
          path: out/*.apk
          if-no-files-found: error

  build-android-core:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 != '' }}
      AIRCAST_ABI: arm64-v8a
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/deploy/android/android_release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      QT_ANDROID_ABIS: ${{ needs.setup.outputs.is_production == 'true' && 'arm64-v8a;armeabi-v7a' || 'arm64-v8a' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set Android SDK location
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Build Setup (Android)
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: Release
          save-cache: 'false'

      - name: Install host build dependencies
        uses: ./.github/actions/install-dependencies

      - name: Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          cache: 'true'
          android-abis: ${{ env.QT_ANDROID_ABIS }}
          cargo-ndk: 'true'

      - name: Install release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$QT_ANDROID_KEYSTORE_STORE_PASS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$QT_ANDROID_KEYSTORE_PATH"
            echo "Installed aircast release keystore"
          else
            echo "::warning::No keystore secret - signing the APK with a throwaway debug key"
            keytool -genkey -v \
              -keystore "${RUNNER_TEMP}/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
              echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
              echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
              echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Set up the pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.setup.outputs.android_java_version }}

      - name: Install the Play upload keystore
        if: ${{ env.HAS_PLAY_UPLOAD_KEYSTORE == 'true' }}
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/play-upload.keystore"

      - name: Build the Rust core head bundle
        working-directory: ${{ github.workspace }}/android
        env:
          AIRCAST_QGC_AAR: ${{ runner.temp }}/build/android-build/AircastQGC.aar
          AIRCAST_KEYSTORE: >-
            ${{ env.HAS_PLAY_UPLOAD_KEYSTORE == 'true' && format('{0}/play-upload.keystore', runner.temp)
            || (secrets.ANDROID_KEYSTORE_BASE64 != '' && env.QT_ANDROID_KEYSTORE_PATH || '') }}
          AIRCAST_KEYSTORE_PASSWORD: ${{ env.HAS_PLAY_UPLOAD_KEYSTORE == 'true' && secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          AIRCAST_KEY_ALIAS: ${{ env.HAS_PLAY_UPLOAD_KEYSTORE == 'true' && 'aircast-upload' || env.QT_ANDROID_KEYSTORE_ALIAS }}
          AIRCAST_VERSION_CODE: ${{ github.run_number }}
          RELEASE_TAG: ${{ needs.setup.outputs.version }}
          OTEL_BETA_INGEST_TOKEN: ${{ needs.setup.outputs.environment == 'beta' && secrets.OTEL_BETA_INGEST_TOKEN || '' }}
        run: |
          export AIRCAST_VERSION_NAME="${RELEASE_TAG#aircast-v}"
          ./gradlew --no-daemon :app:testCoreDebugUnitTest
          ./gradlew --no-daemon -Paircast.coreApplicationId=one.aircast.app :app:bundleCoreRelease :app:assembleCoreRelease

      - name: Collect the Rust core head bundle and APK
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/coreRelease/app-core-release.aab "out/AircastAndroidCore-${SHORT}.aab"
          for f in android/app/build/outputs/apk/core/release/app-core-release*.apk; do
            case "$f" in
              *unsigned*) cp "$f" "out/AircastAndroidCore-${SHORT}-unsigned.apk" ;;
              *)          cp "$f" "out/AircastAndroidCore-${SHORT}.apk" ;;
            esac
          done

      - name: Authenticate to Google Play
        id: play_auth
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/334352171308/locations/global/workloadIdentityPools/github/providers/github
          service_account: play-publisher@aircast-439915.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Publish the Rust core head to Google Play
        if: ${{ steps.play_auth.outcome == 'success' }}
        continue-on-error: ${{ needs.setup.outputs.is_production != 'true' }}
        uses: ./.github/actions/playstore
        with:
          package_name: one.aircast.app
          artifact: out/AircastAndroidCore-${{ needs.setup.outputs.short_version }}.aab
          service_account_json_file: ${{ steps.play_auth.outputs.credentials_file_path }}
          track: >-
            ${{ needs.setup.outputs.is_production == 'true' && (vars.PLAY_PRODUCTION_TRACK || 'production')
            || (needs.setup.outputs.environment == 'beta' && (vars.PLAY_BETA_TRACK || 'alpha') || 'internal') }}
          status: completed

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-android-core
          path: |
            out/*.aab
            out/*.apk
          if-no-files-found: error

  build-ios:
    needs: setup
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - name: Checkout repo
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        with:
          xcode-version: latest-stable

      - name: Rust toolchain
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        uses: ./.github/actions/rust-toolchain
        with:
          cache: 'true'
          targets: aarch64-apple-ios

      - name: Install XcodeGen and fastlane
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          gem install fastlane -v 2.241.1 --no-document --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Install the App Store Connect key
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          jq -n --arg id "$ASC_KEY_ID" --arg iss "$ASC_ISSUER_ID" --rawfile key "$RUNNER_TEMP/asc.p8" \
            '{key_id: $id, issuer_id: $iss, key: $key}' > "$RUNNER_TEMP/asc.json"

      - name: Check Apple's agreements are accepted
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" ruby ios/agreements.rb

      - name: Import the CI development certificate
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERT_P12_PASSWORD }}

      - name: Upload to TestFlight
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SHORT: ${{ needs.setup.outputs.short_version }}
          OTEL_BETA_INGEST_TOKEN: ${{ needs.setup.outputs.environment == 'beta' && secrets.OTEL_BETA_INGEST_TOKEN || '' }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          MARKETING_VERSION=$(echo "$SHORT" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' | cut -c2-)
          export MARKETING_VERSION
          ios/testflight.sh || { cat build-ios/testflight/*.log | tail -100; exit 1; }

      - name: Release to public TestFlight testers
        if: ${{ env.HAS_ASC_KEY == 'true' }}
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          MARKETING_VERSION=$(echo "$SHORT" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' | cut -c2-)
          distribute() {
            fastlane pilot distribute \
              --api_key_path "$RUNNER_TEMP/asc.json" \
              --app_identifier one.aircast.app \
              --app_version "$MARKETING_VERSION" \
              --app_platform ios \
              --distribute_external true \
              --groups Public \
              --notify_external_testers true \
              --changelog "Aircast $SHORT. Release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          }
          for attempt in $(seq 1 40); do
            distribute 2>&1 | tee "$RUNNER_TEMP/distribute.log" && exit 0
            if grep -q "Another build is in review" "$RUNNER_TEMP/distribute.log"; then
              echo "::warning::An earlier $MARKETING_VERSION build is still in TestFlight beta review; this build reaches internal testers now and external testers once Apple approves the train"
              exit 0
            fi
            grep -q "No build to distribute" "$RUNNER_TEMP/distribute.log" || exit 1
            echo "App Store Connect is still processing the upload (attempt $attempt of 40); trying again in a minute"
            sleep 60
          done
          exit 1

      - name: Submit to App Store review
        if: ${{ env.HAS_ASC_KEY == 'true' && needs.setup.outputs.is_production == 'true' }}
        working-directory: ios
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc.json" \
            --app_identifier one.aircast.app \
            --platform ios \
            --app_version "${SHORT#v}" \
            --skip_binary_upload true \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --overwrite_screenshots true \
            --app_rating_config_path fastlane/app_rating_config.json \
            --submit_for_review true --automatic_release true \
            --run_precheck_before_submit false \
            --submission_information '{"add_id_info_uses_idfa": false}' \
            --force true

  build-desktop:
    needs: setup
    uses: ./.github/workflows/desktop.yml  # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.setup.outputs.version }}
      short_version: ${{ needs.setup.outputs.short_version }}
    secrets:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
      MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      OTEL_BETA_INGEST_TOKEN: ${{ needs.setup.outputs.environment == 'beta' && secrets.OTEL_BETA_INGEST_TOKEN || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  build-windows:
    needs: setup
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release

      - name: Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          cache: 'true'

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'

      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}
        run: echo "${GST_ROOT}/bin" >> "$GITHUB_PATH"

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Sanity check release executable
        working-directory: ${{ runner.temp }}\build\Release
        run: AircastQGC.exe --simple-boot-test

      - name: Create installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: Release

      - name: Collect installer
        shell: pwsh
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "${{ runner.temp }}\build\AircastQGC-installer-AMD64.exe" "out\AircastQGC-$env:SHORT-installer.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-windows
          path: out/*.exe
          if-no-files-found: error

  build-windows-arm64:
    needs: setup
    runs-on: windows-11-arm
    timeout-minutes: 120
    continue-on-error: true
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows_arm64
          qt-arch: win64_msvc2022_arm64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release

      - name: Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          cache: 'true'

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'

      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}
        run: echo "${GST_ROOT}/bin" >> "$GITHUB_PATH"

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: Release

      - name: Collect installer
        shell: pwsh
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "${{ runner.temp }}\build\AircastQGC-installer-ARM64.exe" "out\AircastQGC-$env:SHORT-installer-arm64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-windows-arm64
          path: out/*.exe
          if-no-files-found: error

  build-linux:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Release

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          cache: 'true'

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create AppImage
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Sanity check release executable
        working-directory: ${{ runner.temp }}/build
        run: |
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a ./AircastQGC-x86_64.AppImage --simple-boot-test
          else
            echo "xvfb-run not available on this runner - skipping boot test"
          fi

      - name: Collect AppImage
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          mkdir -p out
          cp "${RUNNER_TEMP}/build/AircastQGC-x86_64.AppImage" "out/AircastQGC-${SHORT}-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-linux
          path: out/*.AppImage
          if-no-files-found: error

  build-web:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/aircast-one/qgc-web:${{ needs.setup.outputs.short_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          cache: 'true'
          targets: wasm32-unknown-unknown

      - name: Install llvm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Build core
        env:
          OTEL_BETA_INGEST_TOKEN: ${{ needs.setup.outputs.environment == 'beta' && secrets.OTEL_BETA_INGEST_TOKEN || '' }}
        run: web/build-core.sh

      - name: Build web
        working-directory: web
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.version }}
        run: |
          export VITE_APP_VERSION="${RELEASE_TAG#aircast-v}"
          npm ci && npm run build

      - name: Pack the web build for devices
        run: tar -czf qgc-web.tar.gz -C web/dist .

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-web
          path: qgc-web.tar.gz

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy to fly.aircast.one
        if: needs.setup.outputs.environment == 'production' || needs.setup.outputs.environment == 'beta'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: ${{ needs.setup.outputs.short_version }}
          SOURCE_REF: refs/tags/${{ needs.setup.outputs.version }}
        run: |
          jq -n --arg tag "$TAG" --arg ref "$SOURCE_REF" \
            '{event_type: "update-image", client_payload: {app_name: "qgc-web", environment: "production", image_tag: $tag, source_ref: $ref}}' \
            | curl -fsS -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token ${PAT_TOKEN}" \
                https://api.github.com/repos/aircast-one/aircast-gitops/dispatches \
                -d @-

  publish:
    needs: [setup, build-android, build-android-core, build-desktop, build-windows, build-linux, build-web]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what this release can carry
        id: platforms
        env:
          IS_PRODUCTION: ${{ needs.setup.outputs.is_production }}
          RESULTS: |
            Android ${{ needs.build-android.result }}
            Android-core ${{ needs.build-android-core.result }}
            Desktop ${{ needs.build-desktop.result }}
            Windows ${{ needs.build-windows.result }}
            Linux ${{ needs.build-linux.result }}
        run: |
          MISSING=$(echo "$RESULTS" | awk 'NF && $2 != "success" { printf "%s%s", sep, $1; sep=", " }')
          if [ -z "$MISSING" ]; then
            echo "every platform built"
            echo "missing=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_PRODUCTION" = "true" ]; then
            echo "::error::A production release must carry every platform. Did not build: $MISSING"
            exit 1
          fi
          echo "::warning::Publishing a partial pre-release. Did not build: $MISSING"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          pattern: qgc-*
          merge-multiple: true
          path: assets

      - name: Checksums
        run: |
          cd assets
          for f in *.apk *.dmg *.exe *.zip *.AppImage *.tar.gz; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done || true
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          V: ${{ needs.setup.outputs.version }}
          SHORT: ${{ needs.setup.outputs.short_version }}
          IS_PRODUCTION: ${{ needs.setup.outputs.is_production }}
          MISSING: ${{ steps.platforms.outputs.missing }}
        run: |
          if [ -z "$(ls -A assets)" ]; then
            echo "::error::No build produced an artifact, so there is nothing to release."
            exit 1
          fi
          PRE=""
          if [ "$IS_PRODUCTION" != "true" ]; then
            PRE="--prerelease"
          fi
          git fetch --force origin "refs/tags/$V:refs/tags/$V"
          TAG_NOTES=$(git cat-file tag "$V" | sed '1,/^$/d; /^-----BEGIN PGP SIGNATURE-----$/,$d')
          {
            if [ -n "$MISSING" ]; then
              printf '> **This release is incomplete.** No build was produced for: %s.\n\n' "$MISSING"
            fi
            if [ "$(printf '%s\n' "$TAG_NOTES" | wc -l)" -gt 1 ]; then
              printf '%s\n' "$TAG_NOTES"
            else
              scripts/release-notes.sh "$V"
            fi
            printf '\n**Android:** AircastAndroidCore-%s.apk is the same app as Google Play, 3D map included. AircastAndroid-%s.apk is the Qt-host build. Both install as one.aircast.app, so uninstall one before switching to the other.\n' "$SHORT" "$SHORT"
          } > release-notes.md
          if gh release view "$V" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$V" -R "$REPO" --clobber assets/*
          else
            gh release create "$V" -R "$REPO" \
              --title "Aircast QGC $SHORT" \
              --notes-file release-notes.md \
              $PRE assets/*
          fi

      - name: Point desktop updates at this release
        if: needs.setup.outputs.environment == 'production' || needs.setup.outputs.environment == 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          V: ${{ needs.setup.outputs.version }}
          SHORT: ${{ needs.setup.outputs.short_version }}
          IS_PRODUCTION: ${{ needs.setup.outputs.is_production }}
        run: |
          set -euo pipefail
          if ! scripts/desktop-update-manifest.sh assets "$SHORT" "https://github.com/$REPO/releases/download/$V" release-notes.md > beta.json; then
            echo "::warning::This release has no signed desktop build for every platform, so desktop apps keep updating to the previous release."
            exit 0
          fi
          if ! gh release view desktop-updates -R "$REPO" >/dev/null 2>&1; then
            gh release create desktop-updates -R "$REPO" --prerelease --target "$(git rev-parse HEAD)" \
              --title "Desktop app updates" \
              --notes "The desktop app reads beta.json and stable.json from here to find its next update. Release CI replaces them; download Aircast from the aircast-v* releases."
          fi
          MANIFESTS=(beta.json)
          if [ "$IS_PRODUCTION" = "true" ]; then
            cp beta.json stable.json
            MANIFESTS+=(stable.json)
          fi
          gh release upload desktop-updates -R "$REPO" --clobber "${MANIFESTS[@]}"

      - name: Hand the web build to aircastd
        if: needs.setup.outputs.environment == 'production' || needs.setup.outputs.environment == 'beta'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          V: ${{ needs.setup.outputs.version }}
        run: |
          if [ ! -f assets/qgc-web.tar.gz ]; then
            echo "This release has no web build, so aircastd keeps its pin."
            exit 0
          fi
          jq -n --arg version "$V" '{event_type: "qgc-web-release", client_payload: {version: $version}}' \
            | curl -fsS -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: token ${PAT_TOKEN}" \
                https://api.github.com/repos/aircast-one/aircastd/dispatches \
                -d @-

  cleanup-old-releases:
    needs: [setup, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ENV: ${{ needs.setup.outputs.environment }}
          IS_PRODUCTION: ${{ needs.setup.outputs.is_production }}
        run: |
          KEEP_COUNT=5

          if [ "$IS_PRODUCTION" == "true" ]; then
            TAG_PATTERN='^aircast-v[0-9]+\\.[0-9]+\\.[0-9]+$'
          elif [ "$ENV" == "beta" ]; then
            TAG_PATTERN='^aircast-v.*-beta\\..*$'
          elif [ "$ENV" == "staging" ]; then
            TAG_PATTERN='^aircast-v.*-staging\\..*$'
          else
            TAG_PATTERN='^aircast-v.*-dev\\..*$'
          fi

          RELEASES=$(gh api "repos/$REPO/releases" \
            --paginate \
            --jq "[.[] | select(.tag_name | test(\"$TAG_PATTERN\")) | {id: .id, tag_name: .tag_name, created_at: .created_at}] | sort_by(.created_at) | reverse")

          TOTAL_COUNT=$(echo "$RELEASES" | jq 'length')
          echo "Found $TOTAL_COUNT releases for $ENV"

          if [ "$TOTAL_COUNT" -gt "$KEEP_COUNT" ]; then
            RELEASES_TO_DELETE=$(echo "$RELEASES" | jq ".[$KEEP_COUNT:]")
            DELETE_COUNT=$(echo "$RELEASES_TO_DELETE" | jq 'length')
            echo "Deleting $DELETE_COUNT old releases..."

            echo "$RELEASES_TO_DELETE" | jq -c '.[]' | while read -r release; do
              RELEASE_ID=$(echo "$release" | jq -r '.id')
              TAG_NAME=$(echo "$release" | jq -r '.tag_name')
              echo "Processing: $TAG_NAME"
              gh api -X DELETE "repos/$REPO/releases/$RELEASE_ID" || true
              gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG_NAME" || true
            done
            echo "Kept latest $KEEP_COUNT releases"
          else
            echo "No cleanup needed ($TOTAL_COUNT <= $KEEP_COUNT)"
          fi

  notify:
    needs:
      - setup
      - build-android
      - build-android-core
      - build-ios
      - build-desktop
      - build-windows
      - build-windows-arm64
      - build-linux
      - build-web
      - publish
      - cleanup-old-releases
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.setup.outputs.version }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          ANDROID: ${{ needs.build-android.result }}
          ANDROID_CORE: ${{ needs.build-android-core.result }}
          IOS: ${{ needs.build-ios.result }}
          DESKTOP: ${{ needs.build-desktop.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          WINDOWS_ARM64: ${{ needs.build-windows-arm64.result }}
          LINUX: ${{ needs.build-linux.result }}
          WEB: ${{ needs.build-web.result }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Aircast QGC Release"
            echo "- **Version:** $VERSION ($ENVIRONMENT)"
            echo "- **Android:** $ANDROID"
            echo "- **Android core head:** $ANDROID_CORE"
            echo "- **iOS:** $IOS"
            echo "- **Desktop (macOS, Windows arm64 + x64):** $DESKTOP"
            echo "- **Windows:** $WINDOWS"
            echo "- **Windows ARM64:** $WINDOWS_ARM64 (non-blocking)"
            echo "- **Linux:** $LINUX"
            echo "- **Web:** $WEB"
            echo "- **Release:** https://github.com/$REPO/releases/tag/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
