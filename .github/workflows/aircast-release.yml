name: Aircast Release

# Builds the Aircast QGroundControl fork (Android APK + macOS DMG) on a version
# tag and publishes a GitHub release — the repo is public, so GitHub Releases
# are the distribution channel (no S3 mirror).
#
# Tags are created with `make release.<patch|minor|major|dev|staging>`.
#
# Optional secrets: ANDROID_KEYSTORE_PASSWORD (APK signing),
#                   MACOS_CERT_P12_BASE64 / MACOS_CERT_P12_PASSWORD /
#                   MACOS_SIGNING_IDENTITY / MACOS_NOTARIZATION_* (macOS signing).
# (Uses the built-in GITHUB_TOKEN for the GitHub release — no PAT needed.)

permissions:
  contents: write

on:
  push:
    tags:
      # aircast-v prefix: bare vX.Y.Z is upstream QGC's tag namespace
      - "aircast-v[0-9]+.[0-9]+.[0-9]+" # production: aircast-v5.0.9
      - "aircast-v*-staging.*" # staging:    aircast-v5.0.9-staging.1
      - "aircast-v*-dev.*" # development: aircast-v5.0.9-dev.1
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to (re)release (e.g. aircast-v5.0.9, aircast-v5.0.9-dev.1)"
        required: true
        type: string

env:
  QT_VERSION: 6.8.3

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      environment: ${{ steps.config.outputs.environment }}
      is_production: ${{ steps.config.outputs.is_production }}
    steps:
      - id: config
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^aircast-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -staging\. ]]; then
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi
          echo "Release: $VERSION"

  build-android:
    needs: setup
    # GitHub-hosted: free with unlimited minutes on public repos, 4 cores, and
    # fully parallel with the other platforms. The S3 cache keeps it warm.
    runs-on: ubuntu-latest
    env:
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/deploy/android/android_release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      # PKCS12 keystores have no distinct key password - the store password unlocks the key
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      # Fleet tablets are arm64; build the legacy 32-bit ABI only for production
      QT_ANDROID_ABIS: ${{ needs.setup.outputs.is_production == 'true' && 'armeabi-v7a;arm64-v8a' || 'arm64-v8a' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.version }}
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        run: git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Install Qt for Android
        uses: ./.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: ${{ env.QT_VERSION }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Install release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # The checked-in keystore is upstream's; the aircast signing keystore is
            # injected from a secret so it never lives in this public repo.
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$QT_ANDROID_KEYSTORE_PATH"
            echo "Installed aircast release keystore"
          else
            echo "No keystore secret - APK will be unsigned"
          fi

      - name: Restore shared build cache from S3
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "CCACHE_DIR=${RUNNER_TEMP}/qgc-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          # hash compiler content, not mtime/path - cache entries stay valid across
          # ephemeral runners where compiler install paths and timestamps differ
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/qgc-ccache"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || ! command -v aws >/dev/null; then
            echo "No AWS credentials/cli - building without the shared cache"
            exit 0
          fi
          OBJ="s3://aircast-artifacts/qgc-cache/${{ github.job }}.tar.zst"
          if aws s3 cp "$OBJ" "${RUNNER_TEMP}/qgc-cache.tar.zst" --no-progress 2>/dev/null; then
            tar -I zstd -xf "${RUNNER_TEMP}/qgc-cache.tar.zst" -C "${RUNNER_TEMP}"
            rm -f "${RUNNER_TEMP}/qgc-cache.tar.zst"
            echo "Shared cache restored from $OBJ"
          else
            echo "Shared cache MISS for $OBJ - will seed it after this build"
          fi

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_WARN_DEPRECATED=FALSE
              -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}"
              -DQT_ANDROID_BUILD_ALL_ABIS=OFF
              -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../gcc_64"
              -DQT_ANDROID_SIGN_APK=${{ env.QT_ANDROID_KEYSTORE_STORE_PASS != '' && 'ON' || 'OFF' }}
              -DQGC_STABLE_BUILD=ON

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --build . --target all --config Release

      - name: Save shared build cache to S3
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || ! command -v aws >/dev/null; then exit 0; fi
          cd "${RUNNER_TEMP}"
          ccache -s 2>/dev/null || true
          EXTRA=""
          [ -d shadow_build_dir/cpm_modules ] && EXTRA="shadow_build_dir/cpm_modules"
          tar -I 'zstd -T0 -3' -cf qgc-cache.tar.zst qgc-ccache $EXTRA
          aws s3 cp qgc-cache.tar.zst "s3://aircast-artifacts/qgc-cache/${{ github.job }}.tar.zst" --no-progress
          rm -f qgc-cache.tar.zst
          echo "Shared cache uploaded - any runner picks it up on the next build"

      - name: Collect APK
        run: |
          V="${{ needs.setup.outputs.version }}"
          SHORT="${V#aircast-}"
          mkdir -p out
          cp ${{ runner.temp }}/shadow_build_dir/android-build/*.apk "out/QGroundControl-Aircast-$SHORT.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: qgc-android
          path: out/*.apk

  build-macos:
    needs: setup
    runs-on: [self-hosted, macOS, ARM64]
    env:
      # secrets aren't available in step-level `if:` expressions - surface as env
      HAS_MACOS_CERTS: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.version }}
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        run: git fetch --all --tags -f --depth 1

      # Not ./.github/actions/common: its setup-python assumes the GitHub-hosted
      # image layout (/Users/runner) and fails on self-hosted Macs. The runner
      # provides cmake/ninja/python locally.
      - name: Initial Setup
        run: mkdir -p "$RUNNER_TEMP/shadow_build_dir"

      - name: Install GStreamer (skipped when already present)
        run: |
          if [ -d "/Library/Frameworks/GStreamer.framework" ]; then
            echo "GStreamer.framework already installed - skipping"
          else
            (cd tools/setup && sh install-dependencies-osx.sh)
          fi

      - name: Locate Qt
        id: qt
        run: |
          if [ -d "$HOME/Qt/${QT_VERSION}/macos" ]; then
            echo "QT_ROOT_DIR=$HOME/Qt/${QT_VERSION}/macos" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using preinstalled Qt at $HOME/Qt/${QT_VERSION}/macos"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt
        if: steps.qt.outputs.found != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          cache: true

      - name: Select SDK
        # Newer Xcode SDKs dropped AGL.framework, which Qt's WrapOpenGL still links.
        # Prefer the CommandLineTools 15.4 SDK when the runner has it.
        run: |
          SDK=/Library/Developer/CommandLineTools/SDKs/MacOSX15.4.sdk
          if [ -d "$SDK" ]; then
            echo "SYSROOT_ARG=-DCMAKE_OSX_SYSROOT=$SDK" >> "$GITHUB_ENV"
          else
            echo "SYSROOT_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Restore CPM sources from S3
        continue-on-error: true
        # ccache is local on this runner; only dependency downloads are shared
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "CPM_SOURCE_CACHE=${RUNNER_TEMP}/shadow_build_dir/cpm_modules" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/shadow_build_dir/cpm_modules"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || ! command -v aws >/dev/null; then
            echo "No AWS credentials/cli - building without the shared CPM cache"
            exit 0
          fi
          OBJ="s3://aircast-artifacts/qgc-cache/${{ github.job }}-cpm.tar.zst"
          if aws s3 cp "$OBJ" "${RUNNER_TEMP}/qgc-cpm.tar.zst" --no-progress 2>/dev/null; then
            # pipe form: macOS bsdtar doesn't support GNU tar's -I option
            zstd -d -c "${RUNNER_TEMP}/qgc-cpm.tar.zst" | tar -xf - -C "${RUNNER_TEMP}"
            rm -f "${RUNNER_TEMP}/qgc-cpm.tar.zst"
            echo "CPM cache restored from $OBJ"
          else
            echo "CPM cache MISS for $OBJ - will seed it after this build"
          fi

      - name: CMake configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          # Isolate dependency fetches from the workstation user's git config:
          # an `insteadOf` rewrite there forces CPM/FetchContent over SSH, which
          # breaks when port 22 is blocked or flaky. These steps only read config,
          # so an empty file is safe (checkout, which writes config, is untouched).
          GIT_CONFIG_GLOBAL: /dev/null
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_OSX_ARCHITECTURES=${{ needs.setup.outputs.is_production == 'true' && '"x86_64;arm64"' || 'arm64' }}
              ${{ env.SYSROOT_ARG }}
              -DQGC_STABLE_BUILD=ON
              -DQGC_MACOS_SIGN_WITH_IDENTITY=${{ env.HAS_MACOS_CERTS == 'true' && 'ON' || 'OFF' }}

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: cmake --build . --target all --config Release

      - name: Save CPM sources to S3
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || ! command -v aws >/dev/null; then exit 0; fi
          cd "${RUNNER_TEMP}"
          # pipe form: macOS bsdtar doesn't support GNU tar's -I option
          tar -cf - shadow_build_dir/cpm_modules | zstd -T0 -3 > qgc-cpm.tar.zst
          aws s3 cp qgc-cpm.tar.zst "s3://aircast-artifacts/qgc-cache/${{ github.job }}-cpm.tar.zst" --no-progress
          rm -f qgc-cpm.tar.zst

      - name: Import Code Signing Certificate
        if: env.HAS_MACOS_CERTS == 'true'
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_P12_PASSWORD }}

      - name: Create app bundle (signed/notarized when certs are configured)
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --install . --config Release
        env:
          QGC_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          QGC_MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          QGC_MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          QGC_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}

      # No boot-test here: the runner is a workstation where another QGC instance
      # may be running, and RunGuard would make the test fail spuriously.
      - name: Collect DMG
        run: |
          V="${{ needs.setup.outputs.version }}"
          SHORT="${V#aircast-}"
          mkdir -p out
          cp ${{ runner.temp }}/shadow_build_dir/QGroundControl.dmg "out/QGroundControl-Aircast-$SHORT.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: qgc-macos
          path: out/*.dmg

  build-windows:
    needs: setup
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    env:
      GST_VERSION: 1.22.12
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.version }}
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        run: git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\latest
          key: vulkan-sdk-windows-v1

      - name: Install Vulkan
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          .\vulkan-sdk.exe --root C:\VulkanSDK\latest --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.glm com.lunarg.vulkan.volk com.lunarg.vulkan.vma com.lunarg.vulkan.debug

      - name: Set Vulkan environment
        shell: pwsh
        run: echo "VULKAN_SDK=C:\VulkanSDK\latest" >> $env:GITHUB_ENV

      - name: Cache GStreamer
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: C:\gstreamer
          key: gstreamer-${{ env.GST_VERSION }}-windows-msvc

      - name: Install GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        uses: blinemedical/setup-gstreamer@v1
        with:
          version: ${{ env.GST_VERSION }}

      - name: Set GStreamer environment (cache hit)
        if: steps.gst-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          # FindGStreamer.cmake reads this env (and falls back to C:\gstreamer)
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64" >> $env:GITHUB_ENV
          echo "C:\gstreamer\1.0\msvc_x86_64\bin" >> $env:GITHUB_PATH

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: windows
          target: win64_msvc2022_64
          build-type: Release
          cpm-modules: ${{ runner.temp }}\shadow_build_dir\cpm_modules

      - name: Install Qt for Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          cache: true

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../msvc2022_64"
              -DQGC_STABLE_BUILD=ON

      - name: Build
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: cmake --build . --target all --config Release

      - name: Sanity check release executable
        working-directory: ${{ runner.temp }}\shadow_build_dir\Release
        run: QGroundControl.exe --simple-boot-test

      - name: Create installer
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: cmake --install . --config Release

      - name: Collect installer
        shell: pwsh
        run: |
          $V = "${{ needs.setup.outputs.version }}"
          $SHORT = $V -replace '^aircast-',''
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "${{ runner.temp }}\shadow_build_dir\QGroundControl-installer.exe" "out\QGroundControl-Aircast-$SHORT-installer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: qgc-windows
          path: out/*.exe

  build-linux:
    needs: setup
    # GitHub-hosted: free on public repos and parallel with everything else.
    # NEVER move this to self-hosted infra: infra.aircast.one is a k8s node
    # and a QGC build there starved it and OOM-killed argocd-repo-server.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.version }}
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Get all tags for correct version determination
        run: git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Install Dependencies
        run: |
          chmod a+x ./tools/setup/install-dependencies-debian.sh
          sudo ./tools/setup/install-dependencies-debian.sh

      - name: Install Vulkan
        # Distro packages instead of the LunarG vulkan-sdk meta-package, which has
        # unresolvable dependencies outside Ubuntu jammy (e.g. libyaml-cpp0.7 on noble).
        run: sudo apt-get install -y --no-install-recommends libvulkan-dev vulkan-tools glslang-tools spirv-tools

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: linux
          target: linux_gcc_64
          build-type: Release
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Install Qt for Linux (x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          cache: true

      - name: Restore shared build cache from S3
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "CCACHE_DIR=${RUNNER_TEMP}/qgc-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          # hash compiler content, not mtime/path - cache entries stay valid across
          # ephemeral runners where compiler install paths and timestamps differ
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/qgc-ccache"
          if [ -z "$AWS_ACCESS_KEY_ID" ] || ! command -v aws >/dev/null; then
            echo "No AWS credentials/cli - building without the shared cache"
            exit 0
          fi
          OBJ="s3://aircast-artifacts/qgc-cache/${{ github.job }}.tar.zst"
          if aws s3 cp "$OBJ" "${RUNNER_TEMP}/qgc-cache.tar.zst" --no-progress 2>/dev/null; then
            tar -I zstd -xf "${RUNNER_TEMP}/qgc-cache.tar.zst" -C "${RUNNER_TEMP}"
            rm -f "${RUNNER_TEMP}/qgc-cache.tar.zst"
            echo "Shared cache restored from $OBJ"
          else
            echo "Shared cache MISS for $OBJ - will seed it after this build"
          fi

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DQGC_STABLE_BUILD=ON

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --build . --target all --config Release

      - name: Save shared build cache to S3
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || ! command -v aws >/dev/null; then exit 0; fi
          cd "${RUNNER_TEMP}"
          ccache -s 2>/dev/null || true
          EXTRA=""
          [ -d shadow_build_dir/cpm_modules ] && EXTRA="shadow_build_dir/cpm_modules"
          tar -I 'zstd -T0 -3' -cf qgc-cache.tar.zst qgc-ccache $EXTRA
          aws s3 cp qgc-cache.tar.zst "s3://aircast-artifacts/qgc-cache/${{ github.job }}.tar.zst" --no-progress
          rm -f qgc-cache.tar.zst
          echo "Shared cache uploaded - any runner picks it up on the next build"

      - name: Create AppImage
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --install . --config Release

      - name: Sanity check release executable
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a ./QGroundControl-x86_64.AppImage --simple-boot-test
          else
            echo "xvfb-run not available on this runner - skipping boot test"
          fi

      - name: Collect AppImage
        run: |
          V="${{ needs.setup.outputs.version }}"
          SHORT="${V#aircast-}"
          mkdir -p out
          cp ${{ runner.temp }}/shadow_build_dir/QGroundControl-x86_64.AppImage "out/QGroundControl-Aircast-$SHORT-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: qgc-linux
          path: out/*.AppImage

  publish:
    needs: [setup, build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - name: Checksums
        run: |
          cd assets
          for f in *.apk *.dmg *.exe *.AppImage; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done || true
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.setup.outputs.version }}"
          PRE=""
          if [ "${{ needs.setup.outputs.is_production }}" != "true" ]; then
            PRE="--prerelease"
          fi
          if gh release view "$V" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$V" -R "${{ github.repository }}" --clobber assets/*
          else
            gh release create "$V" -R "${{ github.repository }}" \
              --title "QGroundControl Aircast ${V#aircast-}" \
              --generate-notes \
              $PRE assets/*
          fi

  cleanup-old-releases:
    needs: [setup, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENV="${{ needs.setup.outputs.environment }}"
          KEEP_COUNT=5

          # Match only this channel's tags (double-escaped for jq's regex).
          if [ "${{ needs.setup.outputs.is_production }}" == "true" ]; then
            TAG_PATTERN='^aircast-v[0-9]+\\.[0-9]+\\.[0-9]+$'
          elif [ "$ENV" == "staging" ]; then
            TAG_PATTERN='^aircast-v.*-staging\\..*$'
          else
            TAG_PATTERN='^aircast-v.*-dev\\..*$'
          fi

          RELEASES=$(gh api repos/${{ github.repository }}/releases \
            --paginate \
            --jq "[.[] | select(.tag_name | test(\"$TAG_PATTERN\")) | {id: .id, tag_name: .tag_name, created_at: .created_at}] | sort_by(.created_at) | reverse")

          TOTAL_COUNT=$(echo "$RELEASES" | jq 'length')
          echo "Found $TOTAL_COUNT releases for $ENV"

          if [ "$TOTAL_COUNT" -gt "$KEEP_COUNT" ]; then
            RELEASES_TO_DELETE=$(echo "$RELEASES" | jq ".[$KEEP_COUNT:]")
            DELETE_COUNT=$(echo "$RELEASES_TO_DELETE" | jq 'length')
            echo "Deleting $DELETE_COUNT old releases..."

            echo "$RELEASES_TO_DELETE" | jq -c '.[]' | while read -r release; do
              RELEASE_ID=$(echo "$release" | jq -r '.id')
              TAG_NAME=$(echo "$release" | jq -r '.tag_name')
              echo "Processing: $TAG_NAME"
              gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID || true
              gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/$TAG_NAME || true
            done
            echo "Kept latest $KEEP_COUNT releases"
          else
            echo "No cleanup needed ($TOTAL_COUNT <= $KEEP_COUNT)"
          fi

  notify:
    needs: [setup, build-android, build-macos, build-windows, build-linux, publish, cleanup-old-releases]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## QGroundControl Aircast Release"
            echo "- **Version:** ${{ needs.setup.outputs.version }} (${{ needs.setup.outputs.environment }})"
            echo "- **Android:** ${{ needs.build-android.result }}"
            echo "- **macOS:** ${{ needs.build-macos.result }}"
            echo "- **Windows:** ${{ needs.build-windows.result }}"
            echo "- **Linux:** ${{ needs.build-linux.result }}"
            echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.setup.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
