name: Aircast Release


permissions:
  contents: write

on:
  push:
    tags:
      - "aircast-v[0-9]+.[0-9]+.[0-9]+"
      - "aircast-v*-staging.*"
      - "aircast-v*-dev.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to (re)release (e.g. aircast-v5.0.9, aircast-v5.0.9-dev.1)"
        required: true
        type: string

env:
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      short_version: ${{ steps.config.outputs.short_version }}
      environment: ${{ steps.config.outputs.environment }}
      is_production: ${{ steps.config.outputs.is_production }}
    steps:
      - id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" == "push" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_version=${VERSION#aircast-}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^aircast-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -staging\. ]]; then
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi
          echo "Release: $VERSION"

  build-android:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/deploy/android/android_release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      QT_ANDROID_ABIS: ${{ needs.setup.outputs.is_production == 'true' && 'arm64-v8a;armeabi-v7a' || 'arm64-v8a' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set Android SDK location
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "$GITHUB_ENV"

      - name: Build Setup (Android)
        id: setup
        uses: ./.github/actions/build-setup
        with:
          mode: android
          qt-host: linux
          qt-arch: linux_gcc_64
          abis: ${{ env.QT_ANDROID_ABIS }}
          build-type: Release
          cpm-modules: ${{ runner.temp }}/build/cpm_modules

      - name: Install host build dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$QT_ANDROID_KEYSTORE_STORE_PASS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$QT_ANDROID_KEYSTORE_PATH"
            echo "Installed aircast release keystore"
          else
            echo "::warning::No keystore secret - signing the APK with a throwaway debug key"
            keytool -genkey -v \
              -keystore "${RUNNER_TEMP}/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore"
              echo "QT_ANDROID_KEYSTORE_ALIAS=androiddebugkey"
              echo "QT_ANDROID_KEYSTORE_STORE_PASS=android"
              echo "QT_ANDROID_KEYSTORE_KEY_PASS=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'
          use-qt-cmake: 'false'
          extra-args: >-
            -DCMAKE_WARN_DEPRECATED=FALSE
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup.outputs.target_qt_root_dir }}/lib/cmake/Qt6/qt.toolchain.cmake
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.target_qt_root_dir }}
            -DQT_ANDROID_ABIS=${{ env.QT_ANDROID_ABIS }}
            -DQT_HOST_PATH=${{ steps.setup.outputs.host_qt_root_dir }}
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build
        timeout-minutes: 75
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Collect APK
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          APK_DIR="${RUNNER_TEMP}/build/android-build"
          ls "${APK_DIR}"/*.apk
          mkdir -p out
          cp "${APK_DIR}"/*.apk "out/AircastQGC-${SHORT}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-android
          path: out/*.apk
          if-no-files-found: error

  build-macos:
    needs: setup
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      MACOS_SIGN: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: mac
          qt-arch: clang_64
          build-type: Release

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install packet radio native deps
        run: brew install --quiet libusb libsodium

      - name: Import Code Signing Certificate
        if: env.MACOS_SIGN == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_P12_PASSWORD }}

      - name: CMake configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'
          extra-args: -DQGC_MACOS_SIGN_WITH_IDENTITY=${{ env.MACOS_SIGN == 'true' && 'ON' || 'OFF' }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create app bundle
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
        env:
          QGC_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          QGC_MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          QGC_MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          QGC_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}

      - name: Verify DMG
        working-directory: ${{ runner.temp }}/build
        env:
          SIGNED: ${{ env.MACOS_SIGN }}
        run: |
          hdiutil attach AircastQGC.dmg
          APP=/Volumes/AircastQGC/AircastQGC.app
          test -x "$APP/Contents/MacOS/AircastQGC"
          if [ "$SIGNED" == "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl --assess --type execute --verbose=2 "$APP"
            xcrun stapler validate "$APP"
          fi
          for _ in 1 2 3 4 5; do
            hdiutil detach /Volumes/AircastQGC -force && break || sleep 3
          done || true

      - name: Collect DMG
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          mkdir -p out
          cp "${RUNNER_TEMP}/build/AircastQGC.dmg" "out/AircastQGC-${SHORT}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-macos
          path: out/*.dmg
          if-no-files-found: error

  build-windows:
    needs: setup
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'

      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}
        run: echo "${GST_ROOT}/bin" >> "$GITHUB_PATH"

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Sanity check release executable
        working-directory: ${{ runner.temp }}\build\Release
        run: AircastQGC.exe --simple-boot-test

      - name: Create installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: Release

      - name: Collect installer
        shell: pwsh
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "${{ runner.temp }}\build\AircastQGC-installer-AMD64.exe" "out\AircastQGC-$env:SHORT-installer.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-windows
          path: out/*.exe
          if-no-files-found: error

  build-windows-arm64:
    needs: setup
    runs-on: windows-11-arm
    timeout-minutes: 120
    continue-on-error: true
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows_arm64
          qt-arch: win64_msvc2022_arm64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'

      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}
        run: echo "${GST_ROOT}/bin" >> "$GITHUB_PATH"

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: Release

      - name: Collect installer
        shell: pwsh
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "${{ runner.temp }}\build\AircastQGC-installer-ARM64.exe" "out\AircastQGC-$env:SHORT-installer-arm64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-windows-arm64
          path: out/*.exe
          if-no-files-found: error

  build-linux:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Release

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create AppImage
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Sanity check release executable
        working-directory: ${{ runner.temp }}/build
        run: |
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a ./AircastQGC-x86_64.AppImage --simple-boot-test
          else
            echo "xvfb-run not available on this runner - skipping boot test"
          fi

      - name: Collect AppImage
        env:
          SHORT: ${{ needs.setup.outputs.short_version }}
        run: |
          mkdir -p out
          cp "${RUNNER_TEMP}/build/AircastQGC-x86_64.AppImage" "out/AircastQGC-${SHORT}-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: qgc-linux
          path: out/*.AppImage
          if-no-files-found: error

  publish:
    needs: [setup, build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: assets

      - name: Checksums
        run: |
          cd assets
          for f in *.apk *.dmg *.exe *.AppImage; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done || true
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          V: ${{ needs.setup.outputs.version }}
          SHORT: ${{ needs.setup.outputs.short_version }}
          IS_PRODUCTION: ${{ needs.setup.outputs.is_production }}
        run: |
          PRE=""
          if [ "$IS_PRODUCTION" != "true" ]; then
            PRE="--prerelease"
          fi
          if gh release view "$V" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$V" -R "$REPO" --clobber assets/*
          else
            scripts/release-notes.sh "$V" > release-notes.md
            gh release create "$V" -R "$REPO" \
              --title "Aircast QGC $SHORT" \
              --notes-file release-notes.md \
              $PRE assets/*
          fi

  cleanup-old-releases:
    needs: [setup, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ENV: ${{ needs.setup.outputs.environment }}
          IS_PRODUCTION: ${{ needs.setup.outputs.is_production }}
        run: |
          KEEP_COUNT=5

          if [ "$IS_PRODUCTION" == "true" ]; then
            TAG_PATTERN='^aircast-v[0-9]+\\.[0-9]+\\.[0-9]+$'
          elif [ "$ENV" == "staging" ]; then
            TAG_PATTERN='^aircast-v.*-staging\\..*$'
          else
            TAG_PATTERN='^aircast-v.*-dev\\..*$'
          fi

          RELEASES=$(gh api "repos/$REPO/releases" \
            --paginate \
            --jq "[.[] | select(.tag_name | test(\"$TAG_PATTERN\")) | {id: .id, tag_name: .tag_name, created_at: .created_at}] | sort_by(.created_at) | reverse")

          TOTAL_COUNT=$(echo "$RELEASES" | jq 'length')
          echo "Found $TOTAL_COUNT releases for $ENV"

          if [ "$TOTAL_COUNT" -gt "$KEEP_COUNT" ]; then
            RELEASES_TO_DELETE=$(echo "$RELEASES" | jq ".[$KEEP_COUNT:]")
            DELETE_COUNT=$(echo "$RELEASES_TO_DELETE" | jq 'length')
            echo "Deleting $DELETE_COUNT old releases..."

            echo "$RELEASES_TO_DELETE" | jq -c '.[]' | while read -r release; do
              RELEASE_ID=$(echo "$release" | jq -r '.id')
              TAG_NAME=$(echo "$release" | jq -r '.tag_name')
              echo "Processing: $TAG_NAME"
              gh api -X DELETE "repos/$REPO/releases/$RELEASE_ID" || true
              gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG_NAME" || true
            done
            echo "Kept latest $KEEP_COUNT releases"
          else
            echo "No cleanup needed ($TOTAL_COUNT <= $KEEP_COUNT)"
          fi

  notify:
    needs: [setup, build-android, build-macos, build-windows, build-windows-arm64, build-linux, publish, cleanup-old-releases]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.setup.outputs.version }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          ANDROID: ${{ needs.build-android.result }}
          MACOS: ${{ needs.build-macos.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          WINDOWS_ARM64: ${{ needs.build-windows-arm64.result }}
          LINUX: ${{ needs.build-linux.result }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Aircast QGC Release"
            echo "- **Version:** $VERSION ($ENVIRONMENT)"
            echo "- **Android:** $ANDROID"
            echo "- **macOS:** $MACOS"
            echo "- **Windows:** $WINDOWS"
            echo "- **Windows ARM64:** $WINDOWS_ARM64 (non-blocking)"
            echo "- **Linux:** $LINUX"
            echo "- **Release:** https://github.com/$REPO/releases/tag/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
