[package]
name = "qgc-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "qgc_core"
crate-type = ["staticlib"]

[dependencies]
mavlink = { version = "0.18", default-features = false, features = ["dialect-ardupilotmega", "std", "mav2-message-signing"] }
html-escape = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
shapefile = "0.9.0"
utm = "0.1.6"
sha2 = "0.11.0"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex = "1.13.1"
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
num-traits = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
serialport = "4.10.1"
