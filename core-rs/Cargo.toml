[package]
name = "qgc-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "qgc_core"
crate-type = ["staticlib"]

[dependencies]
mavlink = { version = "0.18", default-features = false, features = ["dialect-ardupilotmega", "std"] }
html-escape = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
